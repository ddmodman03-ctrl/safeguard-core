name: Safeguard Core Matrix

on:
  workflow_call:
    inputs:
      project_tier:
        description: 'enforcement | warning | visibility'
        required: false
        default: 'enforcement'
        type: string
    secrets:
      ANTHROPIC_API_KEY:
        required: false

jobs:
  deterministic-sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Project Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 1. Gitleaks Fast Entropy & Regex Sweep
        run: |
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
          tar -xzf gitleaks_8.18.4_linux_x64.tar.gz
          ./gitleaks detect --source . --redact --verbose
        continue-on-error: true
        id: gitleaks

      - name: 2. TruffleHog Live Credential Verification
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified --json
        continue-on-error: true
        id: trufflehog

      - name: 3. Check for High-Risk BaaS & Infra Schema Changes
        id: baas_check
        run: |
          git diff HEAD~1 HEAD > /tmp/commit.diff 2>/dev/null || git show HEAD > /tmp/commit.diff
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || git ls-files)
          if echo "$CHANGED_FILES" | grep -qE "(supabase/migrations/.*\.sql|firestore\.rules|storage\.rules|vercel\.json|netlify\.toml)"; then
            echo "baas_modified=true" >> $GITHUB_OUTPUT
            echo "High-risk BaaS or infrastructure config change detected."
          else
            echo "baas_modified=false" >> $GITHUB_OUTPUT
          fi

      - name: 4. Checkout Safeguard Core Agent Brain
        if: ${{ steps.gitleaks.outcome == 'failure' || steps.trufflehog.outcome == 'failure' || steps.baas_check.outputs.baas_modified == 'true' }}
        uses: actions/checkout@v4
        with:
          repository: ddmodman03-ctrl/safeguard-core
          path: .safeguard-brain

      - name: 5. Run Gate 3 Multi-Agent Orchestrator (Surgeon + Judge)
        if: ${{ steps.gitleaks.outcome == 'failure' || steps.trufflehog.outcome == 'failure' || steps.baas_check.outputs.baas_modified == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITLEAKS_STATUS: ${{ steps.gitleaks.outcome }}
          TRUFFLEHOG_STATUS: ${{ steps.trufflehog.outcome }}
          BAAS_MODIFIED: ${{ steps.baas_check.outputs.baas_modified }}
        run: |
          if [[ -z "$ANTHROPIC_API_KEY" ]]; then
            echo "ANTHROPIC_API_KEY not set in repo secrets. Skipping Gate 3 Agent Audit."
            exit 0
          fi
          cd .safeguard-brain
          npm install --no-audit --no-fund
          node scripts/run-agents.mjs

      - name: 6. Hard Gate Enforcement
        if: ${{ inputs.project_tier == 'enforcement' && (steps.gitleaks.outcome == 'failure' || steps.trufflehog.outcome == 'failure') }}
        run: |
          echo "[SAFEGUARD HARD BLOCK] Verified secret or credential leak detected in commit history. Build halted."
          exit 1